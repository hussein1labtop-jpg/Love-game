<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>حجر ورق مقص أونلاين</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff;background:linear-gradient(160deg,#4c1d95,#be185d);background-attachment:fixed}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;justify-content:center}
#app{width:100%;max-width:440px;padding:18px 0 40px}
h1{text-align:center;font-size:28px;margin:6px 0 4px}
.sub{text-align:center;opacity:.85;margin-bottom:16px;font-size:14px}
.card{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;opacity:.9;margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:12px;border:0;font-size:16px;font-family:inherit;background:#fff;color:#222}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;font-size:18px;font-weight:700;font-family:inherit;color:#fff;background:#10b981;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.alt{background:rgba(255,255,255,.22)}
.btn.wa{background:#25d366}
.btn:active{transform:scale(.98)}
.hidden{display:none!important}
.sep{text-align:center;opacity:.7;margin:14px 0 2px;font-size:14px}
.turn{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.hint{text-align:center;opacity:.85;font-size:14px;margin-bottom:14px;min-height:20px}
.choices{display:flex;gap:10px}
.choice{flex:1;aspect-ratio:1;border-radius:18px;border:3px solid transparent;background:rgba(255,255,255,.18);font-size:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:inherit}
.choice span{font-size:14px;margin-top:4px}
.choice.sel{border-color:#fde047;background:rgba(253,224,71,.3);transform:scale(1.05)}
.choice:disabled{opacity:.6}
.count{font-size:120px;text-align:center;font-weight:800;margin:30px 0;animation:pop .6s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.reveal{display:flex;justify-content:space-around;text-align:center;margin:10px 0}
.reveal div{font-size:70px}
.reveal small{display:block;font-size:15px;margin-top:4px}
.res{text-align:center;font-size:26px;font-weight:800;margin:10px 0}
.score{display:flex;justify-content:space-around;text-align:center;font-size:15px}
.score b{display:block;font-size:30px}
.top{display:flex;justify-content:space-between;align-items:center}
.mute{background:none;border:0;font-size:24px;color:#fff;cursor:pointer}
.code{font-size:56px;font-weight:800;letter-spacing:8px;text-align:center;direction:ltr;margin:6px 0}
.status{text-align:center;font-size:14px;opacity:.9;margin-top:8px;min-height:18px}
.tip{font-size:13px;opacity:.8;text-align:center;margin-top:10px;line-height:1.6}
#net{font-size:13px;opacity:.9}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111c;padding:12px 18px;border-radius:14px;font-size:15px;max-width:90%;text-align:center;z-index:9}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span id="net"></span><button class="mute" id="mute" aria-label="صوت">🔊</button></div>
  <h1>✊ ✋ ✌️</h1>
  <div class="sub">حجر ورق مقص — أونلاين، كل واحد ببيته</div>

  <!-- القائمة -->
  <div id="s-menu">
    <div class="card">
      <label>اسمك</label>
      <input id="name" placeholder="مثلاً: حسين" maxlength="20">
      <label>رقم واتساب الطرف الثاني (اختياري — حتى يوصلك الواتساب مباشرة إذا خسرت)</label>
      <input id="phone" type="tel" inputmode="tel" placeholder="07xxxxxxxxx" dir="ltr">
    </div>
    <button class="btn" id="create">🏠 سوّي غرفة</button>
    <div class="sep">— أو —</div>
    <div class="card">
      <label>كود الغرفة</label>
      <input id="code" type="tel" inputmode="numeric" maxlength="5" placeholder="12345" dir="ltr" style="text-align:center;font-size:22px;letter-spacing:6px">
      <button class="btn alt" id="join">🚪 ادخل الغرفة</button>
    </div>
    <button class="btn alt hidden" id="install">📲 ثبّت اللعبة كتطبيق</button>
  </div>

  <!-- الانتظار -->
  <div id="s-lobby" class="hidden">
    <div class="card">
      <div class="turn">كود الغرفة</div>
      <div class="code" id="roomcode">-----</div>
      <div class="status" id="lobbystatus">جاري الاتصال...</div>
      <button class="btn wa" id="share" disabled>📤 ابعث الدعوة بالواتساب</button>
      <button class="btn alt" id="copy" disabled>📋 انسخ الرابط</button>
      <button class="btn alt" id="cancel">إلغاء</button>
      <div class="tip" id="lobbytip"></div>
    </div>
  </div>

  <!-- الاختيار -->
  <div id="s-pick" class="hidden">
    <div class="card">
      <div class="turn" id="turn"></div>
      <div class="hint" id="hint"></div>
      <div class="choices">
        <button class="choice" data-c="0">✊<span>حجر</span></button>
        <button class="choice" data-c="1">✋<span>ورق</span></button>
        <button class="choice" data-c="2">✌️<span>مقص</span></button>
      </div>
      <button class="btn" id="ready" disabled>أني جاهز ✅</button>
      <div class="status" id="oppstatus"></div>
    </div>
  </div>

  <!-- العد -->
  <div id="s-count" class="hidden"><div class="count" id="count">3</div></div>

  <!-- النتيجة -->
  <div id="s-result" class="hidden">
    <div class="card">
      <div class="reveal">
        <div><span id="e1"></span><small id="r1"></small></div>
        <div><span id="e2"></span><small id="r2"></small></div>
      </div>
      <div class="res" id="res"></div>
      <button class="btn wa hidden" id="wa">💬 افتح موضوع بالواتساب</button>
      <div class="status hidden" id="waitloser"></div>
      <button class="btn" id="again">جولة ثانية 🔁</button>
      <div class="status" id="oppagain"></div>
      <button class="btn alt" id="leave">طلوع من الغرفة</button>
    </div>
    <div class="card score">
      <div><span id="sn1"></span><b id="sc1">0</b></div>
      <div><span>تعادل</span><b id="sc0">0</b></div>
      <div><span id="sn2"></span><b id="sc2">0</b></div>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const E=["✊","✋","✌️"], N=["حجر","ورق","مقص"];
const $=id=>document.getElementById(id);
/* سيرفرات وسيطة مجانية (الكود أول رقم منه يحدد السيرفر) */
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081"];

let client=null, code="", isHost=false, myName="", oppName="", oppPhone="";
let me=null, peerSid=null, opp=null, results={}, lastWaN=0;
let phase="menu", myPick=null, oppPick=null, iReady=false, resultAt=0, waitTimer=null;
const rid=()=>Math.random().toString(36).slice(2,10);
const base=()=>"rpsfz/v2/"+code;
const myTopic=()=>base()+(isHost?"/h":"/g");
const otherTopic=()=>base()+(isHost?"/g":"/h");
const freshMe=()=>({sid:rid(),round:1,picks:{},ack:null,hs:null,waN:0,bye:false});

/* ---------- صوت ---------- */
let actx=null, muted=localStorage.getItem("rps_mute")==="1";
$("mute").textContent=muted?"🔇":"🔊";
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==="suspended")actx.resume(); return actx; }
function tone(f,t0,d,type="sine",v=.25){
  if(muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(c.destination);
  const t=c.currentTime+t0;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.start(t); o.stop(t+d+.05);
}
const snd={
  click:()=>tone(660,0,.08,"triangle"),
  pick:()=>tone(520,0,.1,"square",.15),
  ready:()=>{tone(523,0,.1);tone(784,.1,.15)},
  join:()=>{tone(523,0,.12);tone(659,.12,.12);tone(784,.24,.2)},
  beep:()=>tone(440,0,.2,"square",.2),
  go:()=>tone(880,0,.4,"square",.25),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.25,"triangle",.3)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,i*.18,.3,"sawtooth",.18)),
  draw:()=>{tone(440,0,.2);tone(440,.25,.2)}
};
$("mute").onclick=()=>{muted=!muted;localStorage.setItem("rps_mute",muted?"1":"0");$("mute").textContent=muted?"🔇":"🔊";if(!muted){ac();snd.click()}};

/* ---------- واجهة ---------- */
function show(id){["menu","lobby","pick","count","result"].forEach(s=>$("s-"+s).classList.toggle("hidden",s!==id)); phase=id;}
let tt; function toast(m,ms=3500){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(tt);tt=setTimeout(()=>t.classList.add("hidden"),ms)}
function setNet(ok){ $("net").textContent= ok===null?"" : ok?"🟢 متصل":"🟠 يعيد الاتصال..."; }

$("name").value=localStorage.getItem("rps_name")||"";
$("phone").value=localStorage.getItem("rps_phone")||"";
const urlRoom=(new URLSearchParams(location.search).get("room")||"").replace(/\D/g,"").slice(0,5);
if(urlRoom) $("code").value=urlRoom;

function readProfile(){
  myName=$("name").value.trim()||"لاعب";
  oppPhone=$("phone").value.trim();
  localStorage.setItem("rps_name",$("name").value.trim());
  localStorage.setItem("rps_phone",oppPhone);
}
function waNumber(p){
  let d=(p||"").replace(/\D/g,""); if(!d)return "";
  if(d.startsWith("00"))d=d.slice(2);
  else if(d.startsWith("0"))d="964"+d.slice(1);
  return d;
}
function inviteUrl(){ return location.origin+location.pathname+"?room="+code; }

/* ---------- حفظ الجلسة (حتى لو الصفحة تنعاد تحميلها) ---------- */
function save(){
  if(!me)return;
  localStorage.setItem("rps_sess",JSON.stringify({code,isHost,myName,oppPhone,me,peerSid,oppName,results,lastWaN,t:Date.now()}));
}
function clearSave(){ localStorage.removeItem("rps_sess"); }

/* ---------- الاتصال ---------- */
function openClient(idx){
  return new Promise((res,rej)=>{
    let done=false;
    const c=mqtt.connect(BROKERS[idx],{clientId:"rps_"+rid()+rid(),clean:true,reconnectPeriod:2000,connectTimeout:8000,keepalive:30});
    c.on("error",()=>{});
    const to=setTimeout(()=>{ if(!done){done=true;try{c.end(true)}catch(e){} rej(new Error("timeout"))} },9000);
    c.once("connect",()=>{ if(!done){done=true;clearTimeout(to);res(c)} });
  });
}
function publish(){
  if(!client||!client.connected||!me)return;
  const keep={}; Object.keys(me.picks).forEach(k=>{ if(+k>=me.round-2) keep[k]=me.picks[k]; });
  client.publish(myTopic(),JSON.stringify({sid:me.sid,name:myName,ack:me.ack,hs:me.hs,round:me.round,picks:keep,waN:me.waN,bye:me.bye,ts:Date.now()}),{qos:1,retain:true});
}
function attach(c){
  client=c;
  const onConn=()=>{ try{c.subscribe(otherTopic(),{qos:1})}catch(e){} publish(); setNet(true); };
  c.on("connect",onConn);
  c.on("close",()=>setNet(false));
  c.on("offline",()=>setNet(false));
  c.on("message",(t,p)=>{ if(t===otherTopic()) handle(p); });
  onConn();
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!client)return;
  if(!client.connected){ try{client.reconnect()}catch(e){} } else publish();
});
window.addEventListener("online",()=>{ if(client&&!client.connected){try{client.reconnect()}catch(e){}} });

function startWaitTimer(){
  clearTimeout(waitTimer);
  waitTimer=setTimeout(()=>{ if(phase==="lobby") leave(isHost?"محد دخل الغرفة، سوّي غرفة جديدة":"ما لقيت الغرفة، تأكد من الكود"); },5*60*1000);
}

/* إنشاء غرفة */
$("create").onclick=async()=>{
  ac(); snd.click(); readProfile(); isHost=true;
  show("lobby"); $("roomcode").textContent="-----";
  $("share").disabled=true; $("copy").disabled=true;
  $("lobbystatus").textContent="جاري الاتصال بالسيرفر...";
  $("lobbytip").textContent="";
  let c=null, idx=-1;
  for(let i=0;i<BROKERS.length&&!c;i++){ try{ c=await openClient(i); idx=i; }catch(e){} }
  if(phase!=="lobby"){ if(c)try{c.end(true)}catch(e){} return; }
  if(!c){ show("menu"); toast("ما كدرت اتصل بالسيرفر، تأكد من النت وجرّب مرة ثانية",5000); return; }
  code=String(idx+1)+String(Math.floor(1000+Math.random()*9000));
  me=freshMe(); peerSid=null; opp=null; results={}; lastWaN=0; oppName="";
  $("roomcode").textContent=code;
  $("lobbystatus").textContent="الغرفة جاهزة، ننتظر الطرف الثاني يدخل... ⏳";
  $("lobbytip").textContent="بعد ما تبعث الدعوة ارجع للعبة، الاتصال يرجع تلقائياً ولا تسكّر الصفحة.";
  $("share").disabled=false; $("copy").disabled=false;
  attach(c); save(); startWaitTimer();
};
$("share").onclick=()=>{
  snd.click();
  const msg="تعالي نلعب حجر ورق مقص 🎮\nكود الغرفة: "+code+"\n"+inviteUrl();
  const num=waNumber(oppPhone);
  window.open((num?"https://wa.me/"+num:"https://wa.me/")+"?text="+encodeURIComponent(msg),"_blank");
};
$("copy").onclick=async()=>{
  snd.click();
  try{await navigator.clipboard.writeText(inviteUrl());toast("اننسخ الرابط ✅")}catch(e){toast(inviteUrl(),8000)}
};
$("cancel").onclick=()=>{snd.click();leave()};

/* دخول غرفة */
$("join").onclick=()=>{
  ac(); snd.click(); readProfile();
  const cd=$("code").value.replace(/\D/g,"");
  const idx=+cd[0]-1;
  if(cd.length!==5||!(idx>=0&&idx<BROKERS.length)){toast("اكتب كود الغرفة صحيح (5 أرقام)");return;}
  isHost=false; code=cd; me=freshMe(); peerSid=null; opp=null; results={}; lastWaN=0; oppName="";
  joinRoom(idx,false);
};
async function joinRoom(idx,resuming){
  show("lobby"); $("roomcode").textContent=code;
  $("share").disabled=true; $("copy").disabled=true;
  $("lobbystatus").textContent=resuming?"نرجعك للغرفة...":"جاري الدخول للغرفة...";
  $("lobbytip").textContent=isHost?"":"إذا صاحب الغرفة مو موجود هسه، ننتظره ونتصل أول ما يفتح اللعبة.";
  let c=null;
  try{ c=await openClient(idx); }catch(e){}
  if(phase!=="lobby"){ if(c)try{c.end(true)}catch(e){} return; }
  if(!c){ leave("ما كدرت اتصل بالسيرفر، تأكد من النت وجرّب مرة ثانية"); return; }
  attach(c); save(); startWaitTimer();
  if(peerSid) enterGame(); else $("lobbystatus").textContent=isHost?"الغرفة جاهزة، ننتظر الطرف الثاني... ⏳":"ننتظر صاحب الغرفة يكون موجود... ⏳";
}

/* استقبال حالة الطرف الثاني */
function handle(payload){
  const txt=payload&&payload.toString(); if(!txt)return;
  let s; try{s=JSON.parse(txt)}catch(e){return}
  if(!s||!s.sid||!me||s.sid===me.sid)return;

  if(!peerSid){
    if(s.bye)return;
    if(isHost){
      if(s.hs!==me.sid)return;
      peerSid=s.sid; me.ack=s.sid;
    } else {
      if(me.hs!==s.sid){ me.hs=s.sid; publish(); }
      if(s.ack!==me.sid)return;
      peerSid=s.sid; me.ack=s.sid;
    }
    oppName=(s.name||"لاعب").slice(0,20); opp=s;
    if(oppName===myName) oppName+=" (2)";
    lastWaN=s.waN||0;
    save(); publish(); snd.join(); enterGame();
    return;
  }
  if(s.sid!==peerSid)return;
  if(s.bye){ leave((oppName||"الطرف الثاني")+" طلع من الغرفة"); return; }
  opp=s;
  if((s.waN||0)>lastWaN){ toast(oppName+" فتح الواتساب يريد يسولف وياك 💬",6000); }
  lastWaN=s.waN||0;
  save(); react();
}

/* ---------- اللعبة ---------- */
function enterGame(){
  if(["pick","count","result"].includes(phase))return;
  clearTimeout(waitTimer);
  loadRound();
}
function loadRound(){
  const r=me.round;
  myPick=(me.picks[r]!==undefined)?me.picks[r]:null;
  iReady=myPick!==null;
  $("turn").textContent="اختارك يا "+myName+" 🎯";
  $("hint").textContent="اختار وبعدين اضغط جاهز";
  $("oppstatus").textContent="";
  document.querySelectorAll(".choice").forEach(b=>{
    b.classList.toggle("sel",myPick!==null&&+b.dataset.c===myPick);
    b.disabled=iReady;
  });
  $("ready").disabled=!(myPick!==null&&!iReady);
  $("ready").textContent=iReady?"ننتظر "+oppName+"... ⏳":"أني جاهز ✅";
  show("pick"); react();
}
function newRound(r){ me.round=r; loadRound(); publish(); save(); }

function react(){
  oppPick=(opp&&opp.picks&&opp.picks[me.round]!=null)?opp.picks[me.round]:null;
  if(phase==="pick"){
    $("oppstatus").textContent= oppPick!==null ? oppName+" جاهز ✅" : "";
    tryStart();
  } else if(phase==="result"){
    maybeAdvance();
  }
}
function maybeAdvance(){
  if(phase!=="result"||!opp||opp.round<=me.round)return;
  $("oppagain").textContent=oppName+" يريد جولة ثانية 🔁";
  const wait=4000-(Date.now()-resultAt);
  if(wait<=0) newRound(opp.round); else setTimeout(maybeAdvance,wait+50);
}

document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
  if(iReady)return;
  snd.pick(); myPick=+b.dataset.c;
  document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("sel",x===b));
  $("ready").disabled=false;
});
$("ready").onclick=()=>{
  if(myPick===null||iReady)return;
  snd.ready(); iReady=true;
  me.picks[me.round]=myPick; publish(); save();
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  $("ready").disabled=true; $("ready").textContent="ننتظر "+oppName+"... ⏳";
  react();
};
function tryStart(){
  if(phase!=="pick"||!iReady||myPick===null||oppPick===null)return;
  if(results[me.round]) showResult(false); else countdown();
}
function countdown(){
  show("count"); let n=3;
  const tick=()=>{
    const el=$("count"); el.textContent=n; el.style.animation="none"; void el.offsetWidth; el.style.animation="";
    snd.beep();
    if(n>1){n--;setTimeout(tick,900)} else setTimeout(()=>showResult(true),900);
  };
  tick();
}
function showResult(fresh){
  if(myPick===null||oppPick===null||!me)return;
  if(fresh)snd.go();
  $("e1").textContent=E[myPick]; $("e2").textContent=E[oppPick];
  $("r1").textContent=myName+" ("+N[myPick]+")"; $("r2").textContent=oppName+" ("+N[oppPick]+")";
  const d=(myPick-oppPick+3)%3;
  const wa=$("wa"), wl=$("waitloser");
  wa.classList.add("hidden"); wl.classList.add("hidden"); $("oppagain").textContent="";
  if(d===0){
    results[me.round]="d"; $("res").textContent="تعادل 🤝 عيدوها!"; if(fresh)setTimeout(snd.draw,300);
  } else if(d===1){
    results[me.round]="w"; $("res").textContent="🎉 "+myName+" فاز!";
    wl.textContent="ننتظر "+oppName+" (الخسران) يفتح موضوع 😏"; wl.classList.remove("hidden");
    if(fresh)setTimeout(snd.win,300);
  } else {
    results[me.round]="l"; $("res").textContent="🎉 "+oppName+" فاز!";
    wa.classList.remove("hidden");
    if(fresh)setTimeout(snd.lose,300);
  }
  save(); updScore(); resultAt=Date.now(); show("result"); maybeAdvance();
}
function updScore(){
  const v=Object.values(results);
  $("sn1").textContent=myName; $("sn2").textContent=oppName;
  $("sc1").textContent=v.filter(x=>x==="w").length;
  $("sc2").textContent=v.filter(x=>x==="l").length;
  $("sc0").textContent=v.filter(x=>x==="d").length;
}
$("again").onclick=()=>{
  snd.click();
  const target=(opp&&opp.round>me.round)?opp.round:me.round+1;
  newRound(target);
};
$("leave").onclick=()=>{snd.click();leave()};
$("wa").onclick=()=>{
  snd.click(); me.waN++; publish(); save();
  const msg="أني خسرت 😅 وهسه أفتحلك موضوع نسولف بيه... ";
  const num=waNumber(oppPhone);
  window.open((num?"https://wa.me/"+num:"https://wa.me/")+"?text="+encodeURIComponent(msg),"_blank");
};

function leave(msg){
  clearTimeout(waitTimer);
  if(client){
    if(me){ me.bye=true; publish(); }
    const c=client; setTimeout(()=>{try{c.end(true)}catch(e){}},400);
  }
  client=null; me=null; peerSid=null; opp=null; results={}; lastWaN=0;
  clearSave(); setNet(null); show("menu");
  if(msg)toast(msg,5000);
}

/* ---------- استرجاع الجلسة بعد إعادة تحميل الصفحة ---------- */
(function resume(){
  let s=null; try{s=JSON.parse(localStorage.getItem("rps_sess")||"null")}catch(e){}
  if(!s||!s.code||Date.now()-s.t>2*3600*1000||!s.me){ clearSave(); return; }
  if(urlRoom&&urlRoom!==s.code){ clearSave(); return; }
  code=s.code; isHost=s.isHost; myName=s.myName; oppPhone=s.oppPhone||"";
  me=s.me; me.bye=false; peerSid=s.peerSid; oppName=s.oppName||""; results=s.results||{}; lastWaN=s.lastWaN||0;
  updScore();
  const idx=+code[0]-1;
  if(!(idx>=0&&idx<BROKERS.length)){ clearSave(); me=null; return; }
  phase="lobby";
  joinRoom(idx,true);
})();

/* ---------- تثبيت التطبيق ---------- */
let dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("install").classList.remove("hidden")});
$("install").onclick=async()=>{ if(!dp)return; dp.prompt(); await dp.userChoice; dp=null; $("install").classList.add("hidden"); };
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
